services:
  - type: web
    name: reportes-mantencion-test
    runtime: docker
    plan: free
    autoDeploy: false
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DB_SERVER
        sync: false
      - key: DB_PORT
        value: "1433"
      - key: DB_NAME
        value: ReportesMantencionTest
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_DRIVER
        value: ODBC Driver 18 for SQL Server
      - key: DB_ENCRYPT
        value: "yes"
      - key: DB_TRUST_SERVER_CERTIFICATE
        value: "no"
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: UPLOAD_FOLDER
        value: /tmp/reportes-uploads
      - key: WEB_CONCURRENCY
        value: "2"
