{% extends 'base.html' %}{% block title %}Editar usuario | Reportes Mantención{% endblock %}{% block content %}<div class="mx-auto max-w-lg"><a href="{{url_for('auth.users')}}" class="text-sm text-indigo-700">← Usuarios</a><form method="post" class="mt-4 space-y-4 rounded-xl border border-slate-200 bg-white p-6 shadow-sm"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><h1 class="text-xl font-bold">Editar usuario</h1><label class="block text-sm">Nombre completo<input required name="full_name" value="{{user.full_name}}" class="mt-1 w-full rounded-lg border-slate-300"></label><label class="block text-sm">Correo electrónico<input required type="email" name="username" value="{{user.username}}" class="mt-1 w-full rounded-lg border-slate-300"></label><label class="block text-sm">Rol<select name="role" class="mt-1 w-full rounded-lg border-slate-300">{% for role in roles %}<option value="{{role.name}}" {{'selected' if role.name==user.role}}>{{role.name}}</option>{% endfor %}</select></label><label class="block text-sm">Nueva contraseña <span class="text-slate-500">(opcional)</span><input type="password" name="password" minlength="10" class="mt-1 w-full rounded-lg border-slate-300"></label><button class="w-full rounded-lg bg-brand-600 py-2.5 text-sm font-semibold text-white">Guardar cambios</button></form></div>{% endblock %}
