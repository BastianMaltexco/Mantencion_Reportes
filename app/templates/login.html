{% extends 'base.html' %}{% block title %}Ingresar | Reportes Mantención{% endblock %}{% block content %}
<section class="mx-auto mt-10 max-w-md rounded-2xl border border-slate-200 bg-white p-6 shadow-sm sm:p-8"><div class="mb-7"><p class="text-sm font-medium text-indigo-600">PLATAFORMA DE TERRENO</p><h1 class="mt-1 text-2xl font-bold">Bienvenido</h1><p class="mt-2 text-sm text-slate-500">Ingrese con sus credenciales de trabajo.</p></div>
<form method="post" class="space-y-5"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label class="block text-sm font-medium">Correo electrónico<input required autofocus type="email" name="username" autocomplete="username" class="mt-1 w-full rounded-lg border-slate-300 px-3 py-2.5 focus:border-indigo-500 focus:ring-indigo-500"></label><label class="block text-sm font-medium">Contraseña<input required type="password" name="password" autocomplete="current-password" class="mt-1 w-full rounded-lg border-slate-300 px-3 py-2.5 focus:border-indigo-500 focus:ring-indigo-500"></label><button class="w-full rounded-lg bg-brand-600 px-4 py-2.5 font-semibold text-white hover:bg-brand-700">Iniciar sesión</button></form>
</section>{% endblock %}
