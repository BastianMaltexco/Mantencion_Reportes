{% extends 'base.html' %}{% block content %}<div class="mx-auto max-w-3xl"><h1 class="text-2xl font-bold">Carga de petróleo Generadores</h1><form method="post" enctype="multipart/form-data" class="mt-6 space-y-6 rounded-xl border bg-white p-6"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><label class="block font-medium">Fecha y Hora de carga<input required type="datetime-local" name="loaded_at" class="mt-1 w-full rounded border-slate-300"></label>{% for n in [1,2] %}<fieldset class="space-y-4 rounded-xl border p-4"><legend class="px-1 font-semibold">Generador {{n}}</legend><label class="block font-medium">Cantidad de Litros Generador {{n}}<span class="block text-xs font-normal text-slate-500">Cantidad de litros, menor a 750</span><input required type="number" name="liters_{{n}}" min="0" max="749.99" step="0.01" class="mt-1 w-full rounded border-slate-300"></label><label class="block font-medium">Horómetro Generador {{n}}<span class="block text-xs font-normal text-slate-500">Horas de funcionamiento</span><input required type="number" name="hourmeter_{{n}}" min="0" step="0.01" class="mt-1 w-full rounded border-slate-300"></label><label class="block font-medium">Nivel de agua Generador {{n}}<input required type="file" name="water_{{n}}" accept=".jpg,.jpeg,.png" class="mt-1 block"></label><label class="block font-medium">Nivel de Aceite Generador {{n}}<input required type="file" name="oil_{{n}}" accept=".jpg,.jpeg,.png" class="mt-1 block"></label></fieldset>{% endfor %}<label class="block font-medium">Observaciones generales<textarea name="observations" rows="4" class="mt-1 w-full rounded border-slate-300"></textarea></label><button class="rounded-lg bg-indigo-600 px-5 py-3 font-semibold text-white">Crear registro</button></form></div>{% endblock %}
